
name: Auth Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate Auth Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      
      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Lint
        run: npm run lint

      - name: Generate Temporary JWT Keys
        run: |
          mkdir -p .keys
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out .keys/jwt-private.pem
          openssl rsa \
            -pubout \
            -in .keys/jwt-private.pem \
            -out .keys/jwt-public.pem

      # new
      - name: Run E2E Test
        run: npm run test:e2e -- --runInBand
        env:
          JWT_AUDIENCE: devconnect-auth-test
          JWT_ISSUER: devconnect-auth-test
          FRONTEND_URL: http://localhost:3000
          
      - name: Build Application
        run: npm run build
